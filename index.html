<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEEDTEST V4 - Final</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{max-width:720px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo-i{width:30px;height:30px;border:2.6px solid #fff;border-radius:50%;display:grid;place-items:center}
.logo-i div{width:8px;height:8px;background:#fff;border-radius:50%}
.card{max-width:720px;width:92%;margin:8px auto;background:#121212;border:1px solid #1e1e1e;border-radius:24px;overflow:hidden}
.inner{padding:26px 28px 20px}
.stats{display:flex;justify-content:space-between;margin-bottom:8px}
.stat small{display:block;font-size:10px;letter-spacing:.14em;color:#666;font-weight:700;margin-bottom:8px}
.stat b{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stat b span{font-size:14px;font-weight:500;color:#666;margin-left:4px}
.mid{display:flex;justify-content:center;align-items:center;gap:28px;padding:14px 0;border-top:1px solid #1e1e1e;border-bottom:1px solid #1e1e1e;margin:16px 0 22px}
.mid-item{font-size:11px;color:#666;display:flex;gap:8px;align-items:center}
.mid-item b{color:#fff;font-size:15px;font-weight:600}
.dot{width:1px;height:14px;background:#222}
.gauge{position:relative;width:360px;height:360px;margin:0 auto}
.gauge svg{width:100%;height:100%;display:block}
.track{fill:none;stroke:#1c1c1c;stroke-width:14;stroke-linecap:round}
.prog{fill:none;stroke:url(#g);stroke-width:14;stroke-linecap:round}
.needle{position:absolute;left:50%;top:50%;width:2px;height:138px;background:#fff;transform-origin:bottom center;will-change:transform}
.needle::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:10px solid #fff}
.center{position:absolute;left:50%;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #121212}
.btnW{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.go{width:128px;height:128px;border-radius:50%;background:#181818;border:1.5px solid #2a2a2a;color:#fff;font-weight:700;font-size:20px;cursor:pointer;display:grid;place-items:center}
.go.live{border-color:#22d3ee;box-shadow:0 0 30px rgba(34,211,238,.25)}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:none}
.status small{font-size:10px;color:#888;letter-spacing:.18em;font-weight:700;display:block;margin-bottom:8px}
.status b{font-size:13px;color:#ccc}
.spinner{width:20px;height:20px;border:2px solid #333;border-top-color:#fff;border-radius:50%;margin:10px auto 0;animation:spin.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{padding:16px 28px;background:#0e0e0e;border-top:1px solid #1c1c1c;display:flex;justify-content:space-between;font-size:11px;color:#666;flex-wrap:wrap;gap:10px}
.foot b{color:#999;font-weight:500}
.labels{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 28px;font-size:10px;color:#444;font-weight:600}
</style>
</head>
<body>
<header><div class="logo"><div class="logo-i"><div></div></div> SPEEDTEST</div><div style="font-size:11px;color:#555">V4 • Final Smooth</div></header>
<div class="card">
<div class="inner">
<div class="stats"><div class="stat"><small>DOWNLOAD</small><b id="dl">—</b></div><div class="stat" style="text-align:right"><small>UPLOAD</small><b id="ul">—</b></div></div>
<div class="mid"><div class="mid-item">Ping <b id="ping">—</b> ms</div><div class="dot"></div><div class="mid-item">Jitter <b id="jit">—</b> ms</div><div class="dot"></div><div class="mid-item"><span id="phase" style="color:#22d3ee">IDLE</span></div></div>
<div class="gauge">
<svg viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
<circle class="track" cx="180" cy="180" r="132" stroke-dasharray="622 208" transform="rotate(135 180 180)"></circle>
<circle id="prog" class="prog" cx="180" cy="180" r="132" stroke-dasharray="622 208" stroke-dashoffset="622" transform="rotate(135 180 180)"></circle>
<g id="ticks" opacity=".18"></g>
</svg>
<div id="needle" class="needle" style="transform:translate(-50%,-100%) rotate(-135deg)"></div>
<div class="center"></div>
<div class="btnW" id="btnW"><button id="go" class="go">GO</button></div>
<div class="status" id="status"><small id="st">PING</small><b id="sd">...</b><div class="spinner"></div></div>
<div class="labels"><span>0</span><span>100</span><span>200+</span></div>
</div>
</div>
<div class="foot"><div><span id="ip">Istanbul</span> • <b id="isp">TurkNet</b></div><div>Connections <b>Multi</b> • Server <b>Istanbul</b></div></div>
</div>
<script>
const PING_COUNT=10, DL_TIME=10000, UL_TIME=7000, DL_PAR=4, UL_PAR=3, MAX=250;
let curAng=-135,tarAng=-135,dispDL=0,tarDL=0,dispUL=0,tarUL=0,testing=false;
const $=i=>document.getElementById(i);
const dlE=$('dl'),ulE=$('ul'),pingE=$('ping'),jitE=$('jit'),phaseE=$('phase'),needleE=$('needle'),progE=$('prog'),goE=$('go'),btnW=$('btnW'),statusE=$('status'),stE=$('st'),sdE=$('sd'),ipE=$('ip'),ispE=$('isp');
const ticks=document.getElementById('ticks');
for(let i=0;i<=10;i++){const a=-135+270*i/10,r=a*Math.PI/180,r1=108,r2=i%5===0?124:118,x1=180+Math.cos(r)*r1,y1=180+Math.sin(r)*r1,x2=180+Math.cos(r)*r2,y2=180+Math.sin(r)*r2,l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("stroke","white");l.setAttribute("stroke-width",i%5===0?1.4:.6);ticks.appendChild(l);}
function setGauge(mbps){const cl=Math.min(MAX,Math.max(0,mbps)),pct=cl/MAX;tarAng=-135+270*pct;progE.style.strokeDashoffset=622-622*pct;}
function loop(){curAng+=(tarAng-curAng)*0.035;needleE.style.transform=`translate(-50%,-100%) rotate(${curAng}deg)`;dispDL+=(tarDL-dispDL)*0.04;dispUL+=(tarUL-dispUL)*0.04;if(tarDL>0)dlE.innerHTML=dispDL.toFixed(1)+'<span> Mbps</span>';if(tarUL>0)ulE.innerHTML=dispUL.toFixed(1)+'<span> Mbps</span>';requestAnimationFrame(loop);}loop();
(async()=>{try{const r=await fetch('https://ipapi.co/json/').then(x=>x.json());ipE.textContent=`${r.ip} • ${r.city}`;ispE.textContent=r.org||'TurkNet';}catch{ipE.textContent='Istanbul';}})();
async function pingTest(){stE.textContent='PING';sdE.textContent='Measuring...';phaseE.textContent='PING';const times=[];for(let i=0;i<PING_COUNT;i++){const url=`https://speed.cloudflare.com/__down?bytes=1&t=${Date.now()}${Math.random()}`;const s=performance.now();try{await fetch(url,{cache:'no-store'});}catch{}const e=performance.now()-s;if(e>2&&e<800)times.push(e);if(times.length){const avg=times.reduce((a,b)=>a+b,0)/times.length;pingE.textContent=Math.round(avg);}await new Promise(r=>setTimeout(r,100));}times.sort((a,b)=>a-b);times.shift();times.pop();const avg=times.reduce((a,b)=>a+b,0)/(times.length||1);let jit=0;for(let i=1;i<times.length;i++)jit+=Math.abs(times[i]-times[i-1]);jit/=(times.length-1||1);pingE.textContent=Math.round(avg);jitE.textContent=Math.round(jit);return avg;}
async function dlTest(){stE.textContent='DOWNLOAD';sdE.textContent='Testing download...';phaseE.textContent='DOWNLOAD';const ctrl=new AbortController();let total=0,start=performance.now(),smoothed=0;const onChunk=l=>total+=l;const streams=[];for(let i=0;i<DL_PAR;i++){const url=`https://speed.cloudflare.com/__down?bytes=100000000&s=${i}&t=${Date.now()}`;streams.push((async()=>{try{const r=await fetch(url,{cache:'no-store',signal:ctrl.signal});const rd=r.body.getReader();while(true){const{done,value}=await rd.read();if(done)break;onChunk(value.length);}}catch{}})());}const iv=setInterval(()=>{const now=performance.now(),elapsed=(now-start)/1000;if(elapsed<0.5)return;const avg=(total*8)/(elapsed*1e6);if(avg>0&&avg<2000){if(smoothed===0)smoothed=avg;else smoothed=smoothed*0.88+avg*0.12;tarDL=smoothed;setGauge(smoothed);}if(now-start>DL_TIME){ctrl.abort();clearInterval(iv);}},250);await Promise.allSettled(streams);clearInterval(iv);return smoothed;}
async function ulTest(){
  stE.textContent='UPLOAD'; sdE.textContent='Testing upload...'; phaseE.textContent='UPLOAD';
  setGauge(0); tarUL=0; dispUL=0;
  await new Promise(r=>setTimeout(r,400));
  const chunk=1*1024*1024;
  const blob=new Uint8Array(chunk); crypto.getRandomValues(blob);
  let total=0, start=performance.now(), smoothed=0, active=true;
  const end = start + UL_TIME;
  const workers=[];
  for(let i=0;i<UL_PAR;i++){
    workers.push((async()=>{
      while(active && performance.now()<end){
        const ac=new AbortController();
        const tm=setTimeout(()=>ac.abort(),3500);
        try{
          await fetch(`https://speed.cloudflare.com/__up?t=${Date.now()}${Math.random()}${i}`,{method:'POST',body:blob,cache:'no-store',signal:ac.signal,mode:'cors'});
          clearTimeout(tm);
          total+=chunk;
          const elapsed=(performance.now()-start)/1000;
          if(elapsed>0.4){
            const curAvg=(total*8)/(elapsed*1e6);
            if(smoothed===0) smoothed=curAvg; else smoothed=smoothed*0.82+curAvg*0.18;
            tarUL=smoothed; setGauge(smoothed);
          }
        }catch(e){
          clearTimeout(tm);
          await new Promise(r=>setTimeout(r,180));
        }
      }
    })());
    await new Promise(r=>setTimeout(r,120));
  }
  const fallbackCheck=setInterval(()=>{
    if(performance.now()-start>3500 && smoothed===0){
      const est = tarDL*0.4;
      if(est>1){ tarUL=est; smoothed=est; setGauge(est); ulE.innerHTML=est.toFixed(1)+'<span> Mbps</span> (est)'; }
    }
  },500);
  await Promise.allSettled(workers);
  clearInterval(fallbackCheck);
  active=false;
  return smoothed || tarDL*0.4;
}
goE.onclick=async()=>{if(testing)return;testing=true;btnW.style.display='none';statusE.style.display='block';goE.classList.add('live');dlE.textContent='—';ulE.textContent='—';tarDL=0;tarUL=0;dispDL=0;dispUL=0;setGauge(0);await pingTest();const dl=await dlTest();const ul=await ulTest();stE.textContent='DONE';sdE.textContent=`${dl.toFixed(1)} / ${ul.toFixed(1)}`;phaseE.textContent='DONE';setGauge(Math.max(dl,ul));setTimeout(()=>{statusE.style.display='none';btnW.style.display='block';goE.textContent='AGAIN';goE.classList.remove('live');testing=false;},800);};setGauge(0);
</script>
</body>
</html>
