<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEEDTEST V5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{max-width:720px;width:100%;margin:0 auto;display:flex;justify-content:space-between;padding:18px 20px}
.card{max-width:720px;width:92%;margin:10px auto;background:#121212;border:1px solid #1e1e1e;border-radius:24px;overflow:hidden}
.inner{padding:26px 28px}
.stats{display:flex;justify-content:space-between}
.stat small{display:block;font-size:10px;color:#666;letter-spacing:.14em;font-weight:700;margin-bottom:6px}
.stat b{font-size:42px;font-weight:700}
.mid{display:flex;justify-content:center;gap:28px;padding:14px 0;border-top:1px solid #1e1e1e;border-bottom:1px solid #1e1e1e;margin:16px 0}
.gauge{position:relative;width:360px;height:360px;margin:0 auto}
.gauge svg{width:100%;height:100%}
.track{fill:none;stroke:#1c1c1c;stroke-width:14;stroke-linecap:round;stroke-dasharray:622 207;transform:rotate(135deg);transform-origin:50% 50%}
.prog{fill:none;stroke:url(#g);stroke-width:14;stroke-linecap:round;transform:rotate(135deg);transform-origin:50% 50%}
.needle{position:absolute;left:50%;top:50%;width:2px;height:138px;background:#fff;transform-origin:bottom center}
.btnW{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.go{width:128px;height:128px;border-radius:50%;background:#181818;border:1.5px solid #2a2a2a;color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:none}
.foot{padding:16px 28px;background:#0e0e0e;border-top:1px solid #1c1c1c;display:flex;justify-content:space-between;font-size:11px;color:#666}
</style>
</head>
<body>
<header><div style="font-weight:800">SPEEDTEST</div><div style="font-size:11px;color:#555">V5 • Fixed</div></header>
<div class="card">
<div class="inner">
<div class="stats"><div class="stat"><small>DOWNLOAD</small><b id="dl">—</b></div><div class="stat" style="text-align:right"><small>UPLOAD</small><b id="ul">—</b></div></div>
<div class="mid"><div>Ping <b id="ping">—</b> ms</div><div>Jitter <b id="jit">—</b> ms</div><div><span id="phase" style="color:#22d3ee">IDLE</span></div></div>
<div class="gauge">
<svg viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
<circle class="track" cx="180" cy="180" r="132"></circle>
<circle id="prog" class="prog" cx="180" cy="180" r="132" stroke-dasharray="0 1000"></circle>
</svg>
<div id="needle" class="needle" style="transform:translate(-50%,-100%) rotate(-135deg)"></div>
<div class="btnW" id="btnW"><button id="go" class="go">GO</button></div>
<div class="status" id="status"><small id="st">PING</small><b id="sd">...</b></div>
</div>
</div>
<div class="foot"><div>Istanbul • TurkNet</div><div>Same-Origin • No CORS</div></div>
</div>
<script>
const MAX=250; let cur=-135,tar=-135,dDL=0,tDL=0,dUL=0,tUL=0,testing=false;
const $=i=>document.getElementById(i), dlE=$('dl'), ulE=$('ul'), pingE=$('ping'), jitE=$('jit'), phaseE=$('phase'), needleE=$('needle'), progE=$('prog'), goE=$('go'), btnW=$('btnW'), statusE=$('status'), stE=$('st'), sdE=$('sd');
function setGauge(m){const cl=Math.min(MAX,Math.max(0,m)),pct=cl/MAX;tar=-135+270*pct;progE.setAttribute('stroke-dasharray',`${pct*622} 1000`);}
function loop(){cur+=(tar-cur)*0.06;needleE.style.transform=`translate(-50%,-100%) rotate(${cur}deg)`;dDL+=(tDL-dDL)*0.08;dUL+=(tUL-dUL)*0.08;if(tDL>0)dlE.innerHTML=dDL.toFixed(1)+'<span> Mbps</span>';if(tUL>0)ulE.innerHTML=dUL.toFixed(1)+'<span> Mbps</span>';requestAnimationFrame(loop);}loop();
async function pingTest(){phaseE.textContent='PING';stE.textContent='PING';statusE.style.display='block';const times=[];for(let i=0;i<8;i++){const s=performance.now();await fetch('/ping?t='+Date.now());const e=performance.now()-s;if(e<800)times.push(e);pingE.textContent=Math.round(times.reduce((a,b)=>a+b,0)/times.length);await new Promise(r=>setTimeout(r,80));}times.sort((a,b)=>a-b);times.shift();times.pop();const avg=times.reduce((a,b)=>a+b,0)/times.length;let j=0;for(let i=1;i<times.length;i++)j+=Math.abs(times[i]-times[i-1]);pingE.textContent=Math.round(avg);jitE.textContent=Math.round(j/(times.length-1));return avg;}
async function dlTest(){phaseE.textContent='DOWNLOAD';stE.textContent='DOWNLOAD';let total=0,start=performance.now(),smooth=0;const ctrl=new AbortController();const res=await fetch('/download?bytes=50000000&t='+Date.now(),{cache:'no-store',signal:ctrl.signal});const rd=res.body.getReader();const iv=setInterval(()=>{const el=(performance.now()-start)/1000;if(el<0.3)return;const avg=(total*8)/(el*1e6);if(smooth===0)smooth=avg;else smooth=smooth*0.85+avg*0.15;tDL=smooth;setGauge(smooth);if(performance.now()-start>10000){ctrl.abort();clearInterval(iv);}},200);while(true){try{const{done,value}=await rd.read();if(done)break;total+=value.length;}catch{break;}}clearInterval(iv);return smooth;}
async function ulTest(){phaseE.textContent='UPLOAD';stE.textContent='UPLOAD';setGauge(0);tUL=0;dUL=0;await new Promise(r=>setTimeout(r,300));const chunk=1024*1024,blob=new Uint8Array(chunk);crypto.getRandomValues(blob);let total=0,start=performance.now(),smooth=0,end=start+7000;while(performance.now()<end){await fetch('/upload?t='+Date.now(),{method:'POST',body:blob,cache:'no-store'});total+=chunk;const el=(performance.now()-start)/1000;const avg=(total*8)/(el*1e6);if(smooth===0)smooth=avg;else smooth=smooth*0.8+avg*0.2;tUL=smooth;setGauge(smooth);}return smooth;}
goE.onclick=async()=>{if(testing)return;testing=true;btnW.style.display='none';statusE.style.display='block';tDL=0;tUL=0;dDL=0;dUL=0;setGauge(0);await pingTest();const dl=await dlTest();const ul=await ulTest();stE.textContent='DONE';sdE.textContent=dl.toFixed(1)+' / '+ul.toFixed(1);phaseE.textContent='DONE';setGauge(Math.max(dl,ul));setTimeout(()=>{statusE.style.display='none';btnW.style.display='block';goE.textContent='AGAIN';testing=false;},800);};setGauge(0);
</script>
</body>
</html>
