<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEEDTEST V14</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{max-width:720px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.card{max-width:720px;width:92%;margin:10px auto;background:#121212;border:1px solid #1e1e1e;border-radius:24px;overflow:hidden}
.inner{padding:26px 28px}
.stats{display:flex;justify-content:space-between;gap:16px}
.stat small{display:block;font-size:10px;color:#666;letter-spacing:.14em;font-weight:700;margin-bottom:6px}
.stat b{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
.stat b span{font-size:14px;color:#666;margin-left:4px}
.stat.err b{font-size:20px;color:#f87171}
.mid{display:flex;justify-content:center;flex-wrap:wrap;gap:28px;padding:14px 0;border-top:1px solid #1e1e1e;border-bottom:1px solid #1e1e1e;margin:16px 0;font-size:12px;color:#666}
.mid b{color:#fff}
.gauge{position:relative;width:min(360px,80vw);aspect-ratio:1;margin:0 auto}
.gauge svg{width:100%;height:100%}
/* the 135deg rotation lives in the SVG transform attribute (same result in every browser, incl. Safari) */
.track{fill:none;stroke:#1c1c1c;stroke-width:14;stroke-linecap:round;stroke-dasharray:622 207}
.prog{fill:none;stroke:url(#g);stroke-width:14;stroke-linecap:round}
.needle{will-change:transform}
.needle{position:absolute;left:50%;top:50%;width:2px;height:38%;background:#fff;transform-origin:bottom center}
.hub{position:absolute;left:50%;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.btnW{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.go{width:128px;height:128px;border-radius:50%;background:#181818;border:1.5px solid #2a2a2a;color:#fff;font-weight:700;font-size:20px;cursor:pointer;display:grid;place-items:center}
.go:hover{border-color:#22d3ee}
.status{position:absolute;left:50%;top:64%;transform:translateX(-50%);text-align:center;display:none;white-space:nowrap}
.status small{display:block;font-size:10px;color:#666;letter-spacing:.14em;font-weight:700}
.status b{font-size:26px;font-variant-numeric:tabular-nums}
/* upload = purple -> pink, download keeps the original cyan */
.prog.up{stroke:url(#g2)}
.ul-num{background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.stat.err .ul-num{-webkit-text-fill-color:#f87171;color:#f87171}
.info{margin-top:14px;border:1px solid #1e1e1e;border-radius:14px;overflow:hidden;font-size:12px}
.info .row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid #1a1a1a}
.info .row:last-child{border-bottom:0}
.info .row span{color:#666;flex:none}
.info .row b{font-weight:500;text-align:right;word-break:break-word;min-width:0}
.hint{font-size:10px;color:#555;margin-top:6px;text-align:center}
.copy{display:block;width:100%;margin-top:14px;padding:13px;border-radius:14px;border:0;font-size:14px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#8b5cf6,#ec4899)}
.copy:disabled{opacity:.3;cursor:default}
.note{min-height:18px;text-align:center;font-size:12px;color:#f87171;margin-top:6px}
.foot{padding:16px 28px;background:#0e0e0e;border-top:1px solid #1c1c1c;display:flex;justify-content:space-between;font-size:11px;color:#666}
</style>
</head>
<body>
<header><div style="font-weight:800">SPEEDTEST</div><div style="font-size:11px;color:#555">V14 • Multi-stream</div></header>
<div class="card">
  <div class="inner">
    <div class="stats">
      <div class="stat" id="dlBox"><small>DOWNLOAD</small><b id="dl">—</b></div>
      <div class="stat" id="ulBox" style="text-align:right"><small>UPLOAD</small><b id="ul" class="ul-num">—</b></div>
    </div>
    <div class="mid">
      <div>Ping <b id="ping">—</b> ms</div>
      <div>Jitter <b id="jit">—</b> ms</div>
      <div><span id="phase" style="color:#22d3ee">IDLE</span></div>
    </div>
    <div class="gauge">
      <svg viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
        <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs>
        <circle class="track" cx="180" cy="180" r="132" transform="rotate(135 180 180)"></circle>
        <circle id="prog" class="prog" cx="180" cy="180" r="132" stroke-dasharray="0 1000" transform="rotate(135 180 180)"></circle>
      </svg>
      <div id="needle" class="needle" style="transform:translate(-50%,-100%) rotate(-135deg)"></div>
      <div class="hub"></div>
      <div class="btnW" id="btnW"><button id="go" class="go">GO</button></div>
      <div class="status" id="status"><small id="st">PING</small><b id="sd">…</b></div>
    </div>
    <div class="note" id="note"></div>
    <div class="info">
      <div class="row"><span>IP address</span><b id="ipV">…</b></div>
      <div class="row"><span>Provider (ISP)</span><b id="ispV">…</b></div>
      <div class="row"><span>Location</span><b id="locV">…</b></div>
      <div class="row"><span>Connection</span><b id="connV">…</b></div>
    </div>
    <div class="hint" id="connHint"></div>
    <button class="copy" id="copyBtn" disabled>Copy result</button>
    <details id="diag" style="display:none;margin-top:14px">
      <summary style="cursor:pointer;font-size:12px;color:#666">Test details</summary>
      <pre id="diagTxt" style="margin-top:10px;padding:12px;background:#0e0e0e;border:1px solid #1e1e1e;border-radius:12px;font-size:11px;line-height:1.6;color:#9ca3af;white-space:pre-wrap;word-break:break-word"></pre>
      <button id="diagCopy" style="margin-top:8px;padding:6px 12px;font-size:11px;background:#181818;color:#fff;border:1px solid #2a2a2a;border-radius:8px;cursor:pointer">Copy details</button>
    </details>
  </div>
  <div class="foot"><div>Istanbul • 6 streams</div><div>Own server</div></div>
</div>
<script>
// ---------- settings ----------
const CFG = {
  streams: 6,            // parallel streams for download and upload
  dlBytes: 50e6,         // bytes per download request (stream restarts when done)
  ulMB: 8,               // MB per upload request
  minDur: 8000,          // ms: earliest a phase may stop (if speed is stable)
  maxDur: 15000,         // ms: hard stop per phase
  grace: 2500,           // ms ignored at start (TCP slow-start + mobile radio ramp-up)
  maxGauge: 250          // Mbps at full gauge
};

// ---------- UI ----------
const $ = id => document.getElementById(id);
const E = {dl:$('dl'), ul:$('ul'), ping:$('ping'), jit:$('jit'), phase:$('phase'), needle:$('needle'),
  prog:$('prog'), go:$('go'), btnW:$('btnW'), status:$('status'), st:$('st'), sd:$('sd'), note:$('note'),
  dlBox:$('dlBox'), ulBox:$('ulBox')};
let cur=-135, tar=-135, shown={dl:0, ul:0}, target={dl:0, ul:0}, testing=false;

function setGauge(mbps){
  // square-root scale so low speeds (e.g. 5–20 Mbps upload) still move the needle
  const pct = Math.sqrt(Math.min(CFG.maxGauge, Math.max(0, mbps)) / CFG.maxGauge);
  tar = -135 + 270*pct;     // only the TARGET is set here; needle and arc both follow it in render()
}
function fmt(v){ return v >= 100 ? v.toFixed(0) : v.toFixed(1); }
let lastFrame = performance.now();
function render(now){
  // Time-based easing: same feel at 30, 60 or 120 fps (phones differ), no frame-rate dependent lag.
  const dt = Math.min(0.1, Math.max(0, ((now || performance.now()) - lastFrame) / 1000));
  lastFrame = now || performance.now();
  cur += (tar - cur) * (1 - Math.exp(-dt * 7));
  // Needle AND arc are drawn from the same animated value in the same frame, so they can never drift apart.
  const pct = Math.min(1, Math.max(0, (cur + 135) / 270));
  E.needle.style.transform = `translate(-50%,-100%) rotate(${cur.toFixed(2)}deg)`;
  E.prog.setAttribute('stroke-dasharray', `${(pct * 622).toFixed(2)} 1000`);
  for (const k of ['dl','ul']){
    if (target[k] > 0){
      shown[k] += (target[k] - shown[k]) * (1 - Math.exp(-dt * 8));
      E[k].innerHTML = fmt(shown[k]) + '<span>Mbps</span>';
    }
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setPhase(t){
  E.phase.textContent = t; E.st.textContent = t;
  const up = t === 'UPLOAD';
  E.phase.style.color = up ? '#f472b6' : '#22d3ee';
  E.prog.classList.toggle('up', up);
}
function showError(k, msg){
  target[k] = 0;
  E[k].textContent = 'ERROR';
  E[k+'Box'].classList.add('err');
  E.note.textContent = (k==='dl'?'Download':'Upload') + ' failed: ' + msg;
}

// ---------- ping ----------
async function pingTest(){
  setPhase('PING'); E.sd.textContent = '…';
  const times = [];
  for (let i=0; i<10; i++){
    const s = performance.now();
    try {
      const r = await fetch('/ping?r=' + Math.random(), {cache:'no-store'});
      await r.text();
      if (r.ok) times.push(performance.now() - s);
    } catch(e) {}
    if (times.length) E.ping.textContent = Math.round(Math.min(...times));
    await sleep(60);
  }
  if (!times.length){ E.ping.textContent = '—'; return; }
  const valid = times.slice(1);                         // first request pays the TLS/connection setup
  const use = valid.length ? valid : times;
  let j = 0; for (let i=1; i<use.length; i++) j += Math.abs(use[i]-use[i-1]);   // jitter in the order measured
  E.ping.textContent = Math.round(Math.min(...use));
  E.jit.textContent = use.length > 1 ? Math.round(j/(use.length-1)) : 0;
}

// ---------- shared measuring loop ----------
// startStream(ctx) runs one connection that keeps re-requesting until ctx.done.
function measure(kind, startStream){
  return new Promise(resolve => {
    const ctx = {
      bytes: 0, done: false, errors: 0, lastError: '', live: new Set(),
      add(n){ this.bytes += n; },
      fail(msg){ this.errors++; this.lastError = msg; }
    };
    const t0 = performance.now();
    let gT = 0, gB = 0, mbps = 0, sT = 0, sB = 0;
    const hist = [];                    // [time, bytes] over the last ~1.5 s -> smooth live speed for the gauge
    let liveS = 0;                      // extra smoothing on top of the window (removes bursty-progress wobble)
    const samples = [];                 // Mbps per ~1 s window, after the grace period
    for (let i=0; i<CFG.streams; i++) setTimeout(() => { if (!ctx.done) startStream(ctx); }, i*120);

    const iv = setInterval(() => {
      const now = performance.now(), el = now - t0;
      if (!gT && el >= CFG.grace){ gT = now; gB = ctx.bytes; sT = now; sB = ctx.bytes; }
      if (gT && now - sT >= 1000){
        samples.push((ctx.bytes - sB) * 8 / ((now - sT) / 1000) / 1e6);
        sT = now; sB = ctx.bytes;
      }
      if (gT && now - gT > 250) mbps = (ctx.bytes - gB) * 8 / ((now - gT) / 1000) / 1e6;
      else if (el > 250)        mbps = ctx.bytes * 8 / (el / 1000) / 1e6;
      // Gauge shows a short sliding-window rate (smooth, no jump when the grace period ends);
      // the final number is still the grace-to-end average computed above in `mbps`.
      hist.push([now, ctx.bytes]);
      while (hist.length > 2 && now - hist[0][0] > 3000) hist.shift();
      const span = now - hist[0][0];
      const live = span >= 400 ? (ctx.bytes - hist[0][1]) * 8 / (span / 1000) / 1e6 : 0;
      if (live > 0){
        liveS = liveS ? liveS + (live - liveS) * 0.12 : live;
        target[kind] = liveS; setGauge(liveS); E.sd.textContent = fmt(liveS) + ' Mbps';
      }

      // stop early once the last 3 one-second samples agree within 8%
      let stable = false;
      if (el >= CFG.minDur && samples.length >= 3){
        const l = samples.slice(-3), mx = Math.max(...l), mn = Math.min(...l);
        stable = mx > 0 && (mx - mn) / mx < 0.08;
      }
      const hopeless = ctx.bytes === 0 && ctx.errors >= CFG.streams * 3;
      if (el >= CFG.maxDur || stable || hopeless){
        ctx.done = true; clearInterval(iv);
        ctx.live.forEach(h => { try { h.abort(); } catch(e){} });
        resolve({mbps: ctx.bytes > 0 ? mbps : 0, bytes: ctx.bytes, samples, secs: el/1000,
                 error: ctx.bytes > 0 ? '' : (ctx.lastError || 'no data transferred')});
      }
    }, 100);
  });
}

// ---------- download: fetch + streamed reader ----------
function dlStream(ctx){
  (async () => {
    while (!ctx.done){
      const ac = new AbortController(); ctx.live.add(ac);
      try {
        const r = await fetch(`/download?bytes=${CFG.dlBytes}&r=${Math.random()}`, {cache:'no-store', signal: ac.signal});
        if (!r.ok){ ctx.fail('HTTP ' + r.status); await sleep(300); continue; }
        const rd = r.body.getReader();
        for (;;){ const {done, value} = await rd.read(); if (done) break; ctx.add(value.length); }
      } catch(e){
        if (!ctx.done){ ctx.fail(e.message || 'network error'); await sleep(300); }
      } finally { ctx.live.delete(ac); }
    }
  })();
}

// ---------- upload: XHR so we can count bytes as they leave the browser ----------
let ulBlob = null;
function makeUploadBlob(){
  // crypto.getRandomValues() accepts at most 65,536 bytes per call -> fill 1 MB in 64 KB slices.
  // (Passing 1 MB in one call throws QuotaExceededError — that was the old upload bug.)
  const mb = new Uint8Array(1024*1024);
  for (let o=0; o<mb.length; o+=65536) crypto.getRandomValues(mb.subarray(o, o+65536));
  return new Blob(Array(CFG.ulMB).fill(mb), {type:'application/octet-stream'});
}
function ulStream(ctx){
  const once = () => {
    if (ctx.done) return;
    const x = new XMLHttpRequest();
    let sent = 0;
    ctx.live.add(x);
    x.upload.onprogress = e => { if (e.loaded > sent){ ctx.add(e.loaded - sent); sent = e.loaded; } };
    x.onload = () => {
      ctx.live.delete(x);
      if (x.status >= 200 && x.status < 300){
        if (ulBlob.size > sent) ctx.add(ulBlob.size - sent);
        once();
      } else {
        ctx.fail('HTTP ' + x.status);
        setTimeout(once, 300);
      }
    };
    x.onerror = () => { ctx.live.delete(x); if (!ctx.done){ ctx.fail('network error'); setTimeout(once, 300); } };
    x.open('POST', '/upload?r=' + Math.random(), true);
    x.send(ulBlob);
  };
  once();
}

// ---------- visitor info (IP / ISP / location / connection type) + copy ----------
const copyBtn = $('copyBtn');
let visitor = {ip:'', isp:'', city:'', country:'', mobile:null};
let lastResult = null;
let conn = {label:'Unknown', how:'Could not be detected'};

// Connection type is worked out automatically; the visitor never has to choose.
// - Android Chrome reports it directly (navigator.connection.type).
// - iPhone Safari and desktop browsers report nothing, so we combine the provider's "mobile network"
//   flag from /info with the kind of device.
// A web page cannot read the Wi-Fi name (SSID), and cannot tell Wi-Fi from cable on a computer:
// every browser blocks that.
function detectConn(){
  const c = navigator.connection;
  if (c && c.type === 'cellular') return {label:'Mobile data',      how:'Detected from your device'};
  if (c && c.type === 'wifi')     return {label:'Wi-Fi',            how:'Detected from your device'};
  if (c && c.type === 'ethernet') return {label:'Cable (Ethernet)', how:'Detected from your device'};
  const ua = navigator.userAgent || '';
  const phone = /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (visitor.mobile === true)  return {label:'Mobile data', how:'Your provider runs a mobile network'};
  if (visitor.mobile === false) return phone
    ? {label:'Wi-Fi',          how:'Your provider is not a mobile network, so this phone or tablet is on Wi-Fi'}
    : {label:'Wi-Fi or Cable', how:'Browsers cannot tell Wi-Fi from cable on a computer'};
  if (/mobile|mobil|cellular|wireless|gsm|lte/i.test(visitor.isp || ''))
    return {label:'Mobile data (probably)', how:'Guessed from the provider name'};
  return {label:'Unknown', how:'Could not be detected'};
}
function renderConn(){
  conn = detectConn();
  $('connV').textContent = conn.label;
  $('connHint').textContent = conn.how + '.';
}
if (navigator.connection && navigator.connection.addEventListener) navigator.connection.addEventListener('change', renderConn);

(async function loadInfo(){
  try {
    const r = await fetch('/info', {cache:'no-store'});
    visitor = await r.json();
  } catch(e) {}
  const loc = [visitor.city, visitor.country].filter(Boolean).join(', ');
  $('ipV').textContent  = visitor.ip  || 'unavailable';
  $('ispV').textContent = visitor.isp || (visitor.ip ? 'unknown' : 'unavailable');
  $('locV').textContent = loc || (visitor.ip ? 'unknown' : 'unavailable');
  renderConn();
})();

function resultText(){
  const r = lastResult;
  const loc = [visitor.city, visitor.country].filter(Boolean).join(', ');
  return [
    `Speedtest - ${r.time}`,
    `Download: ${r.dl ? fmt(r.dl) + ' Mbps' : 'failed'}`,
    `Upload: ${r.ul ? fmt(r.ul) + ' Mbps' : 'failed'}`,
    `Ping: ${r.ping} ms | Jitter: ${r.jit} ms`,
    `IP: ${visitor.ip || '-'}`,
    `ISP: ${visitor.isp || '-'}`,
    `Location: ${loc || '-'}`,
    `Connection: ${conn.label}`
  ].join('\n');
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(e) {}
  try {                                                    // fallback for older Safari / non-secure pages
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch(e) { return false; }
}
copyBtn.onclick = async () => {
  if (!lastResult) return;
  const ok = await copyText(resultText());
  copyBtn.textContent = ok ? 'Copied ✓' : 'Copy failed';
  setTimeout(() => { copyBtn.textContent = 'Copy result'; }, 2000);
};

// ---------- diagnostics ----------
function showDiag(dl, ul){
  const res = performance.getEntriesByType('resource');
  const protoOf = re => [...new Set(res.filter(e => re.test(e.name)).map(e => e.nextHopProtocol || '?'))].join(', ') || 'n/a (no request finished)';
  const fmtS = s => (s && s.length) ? s.map(v => v.toFixed(0)).join(' ') : '-';
  const net = navigator.connection ? `${navigator.connection.effectiveType || '?'}` : 'n/a';
  const lines = [
    `Protocol   download: ${protoOf(/\/download/)}   upload: ${protoOf(/\/upload/)}`,
    `Streams    ${CFG.streams}   (grace ${CFG.grace/1000}s)`,
    `Ping       ${E.ping.textContent} ms   Jitter ${E.jit.textContent} ms`,
    `Download   ${dl.mbps ? dl.mbps.toFixed(1) : '-'} Mbps over ${dl.secs ? dl.secs.toFixed(1) : '-'}s   (per-second: ${fmtS(dl.samples)})`,
    `Upload     ${ul.mbps ? ul.mbps.toFixed(1) : '-'} Mbps over ${ul.secs ? ul.secs.toFixed(1) : '-'}s   (per-second: ${fmtS(ul.samples)})`,
    `Network    ${net}`,
    `Browser    ${navigator.userAgent}`
  ];
  $('diagTxt').textContent = lines.join('\n');
  $('diag').style.display = 'block';
}
$('diagCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('diagTxt').textContent); $('diagCopy').textContent = 'Copied'; }
  catch(e) { $('diagCopy').textContent = 'Select the text and copy manually'; }
  setTimeout(() => { $('diagCopy').textContent = 'Copy details'; }, 2000);
};

// ---------- run ----------
E.go.onclick = async () => {
  if (testing) return;
  testing = true;
  E.btnW.style.display = 'none'; E.status.style.display = 'block'; E.note.textContent = '';
  for (const k of ['dl','ul']){ target[k] = 0; shown[k] = 0; E[k].textContent = '—'; E[k+'Box'].classList.remove('err'); }
  E.ping.textContent = '—'; E.jit.textContent = '—'; setGauge(0);
  let dl = {mbps:0}, ul = {mbps:0};
  $('diag').style.display = 'none';
  copyBtn.disabled = true; lastResult = null;
  try { performance.clearResourceTimings(); } catch(e) {}
  try {
    await pingTest();

    setPhase('DOWNLOAD'); E.sd.textContent = '…'; setGauge(0);
    dl = await measure('dl', dlStream);
    if (dl.error) showError('dl', dl.error); else target.dl = dl.mbps;

    setPhase('UPLOAD'); E.sd.textContent = '…'; setGauge(0);
    await sleep(300);
    if (!ulBlob) ulBlob = makeUploadBlob();
    ul = await measure('ul', ulStream);
    if (ul.error) showError('ul', ul.error); else target.ul = ul.mbps;
  } catch(e){
    E.note.textContent = 'Test error: ' + (e.message || e);
  } finally {
    try { showDiag(dl, ul); } catch(e) {}
    if (dl.mbps || ul.mbps){
      lastResult = {dl: dl.mbps || 0, ul: ul.mbps || 0, ping: E.ping.textContent, jit: E.jit.textContent,
                    time: new Date().toLocaleString()};
      copyBtn.disabled = false;
    }
    setPhase('DONE');
    E.sd.textContent = `${dl.mbps ? fmt(dl.mbps) : '—'} / ${ul.mbps ? fmt(ul.mbps) : '—'}`;
    setGauge(0);
    setTimeout(() => {
      E.status.style.display = 'none'; E.btnW.style.display = 'block';
      E.go.textContent = 'AGAIN'; testing = false;
    }, 1200);
  }
};
setGauge(0);
</script>
</body>
</html>
